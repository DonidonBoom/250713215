<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Pendaftaran Lomba Sekolah</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script type="text/javascript" src="js/script.js"></script>
</head>
<body>
    <h1>Pendaftaran Lomba Sekolah</h1>
    <form action="#" method="post" onsubmit=" return fn_ValFrom();">
        <p>Nama: <input type="text" name="Nama" id="Nama" /></p>
        <p>Email: <input type="text" name="Email" id="Email" /></p>
        <p>Umur: <input type="text" name="Umur" id="Umur" /></p>
        <p>Pilihan Lomba: <br />
        <select id="kategori" name="kategori">
            <option value="">-- Pilih --</option>
            <option value="C">Cerdas Cermat</option>
            <option value="P">Puisi</option>
            <option value="D">Desain Poster</option>
        </select></p>
        <p><input type="submit" value="Daftar" /></p>
    </form>
</body>
</html>
